# ==============================================================================
# CipherVault GitLab CI Pipeline Configuration
# Zero-Disk Secret Injection & Confidential Build Pipelines
# ==============================================================================

stages:
  - lint
  - test
  - deploy

default:
  image: rust:1.80-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential pkg-config libssl-dev

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/
    - target/

# ------------------------------------------------------------------------------
# LINT STAGE: Formatting & Static Analysis
# ------------------------------------------------------------------------------
lint:formatting-and-clippy:
  stage: lint
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings

# ------------------------------------------------------------------------------
# TEST STAGE: Developer Ergonomics & Synchronization Validation
# ------------------------------------------------------------------------------
test:developer-suite:
  stage: test
  script:
    - cargo test --workspace --locked
    - cargo test -p ciphervault-cli --test diff_test
    - cargo test -p ciphervault-cli --test pull_sync_test

test:completions-generation:
  stage: test
  script:
    - cargo build -p ciphervault-cli --release
    - target/release/ciphervault completions bash > ciphervault.bash
    - target/release/ciphervault completions zsh > ciphervault.zsh
    - test -s ciphervault.bash
    - test -s ciphervault.zsh
  artifacts:
    paths:
      - ciphervault.bash
      - ciphervault.zsh
    expire_in: 1 week

# ------------------------------------------------------------------------------
# DEPLOY STAGE: Zero-Disk Secret Injection Deployment
# ------------------------------------------------------------------------------
deploy:production:
  stage: deploy
  only:
    - main
  script:
    - cargo build -p ciphervault-cli --release
    - export PATH="$(pwd)/target/release:$PATH"
    # Zero-Disk Secret Injection Execution:
    # Decrypts secrets in memory, sets up ephemeral child environment, zeroizes RAM on exit.
    # Secrets are NEVER stored or flushed to runner disk.
    - ciphervault run --quiet -- env
