name: Continuous Integration

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'report/**'
      - '**/*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'report/**'
      - '**/*.md'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

# A newer push supersedes an older one on the same ref: cancel the stale
# run instead of burning billable minutes (macOS legs cost 10x Linux) on
# code that is already outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Code Formatting Check
        run: cargo fmt --all -- --check
        if: runner.os == 'Linux'

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace Unit & Integration Tests
        run: cargo test --workspace --locked --verbose

      - name: Dashboard Syntax and Audit Regressions
        run: |
          node --check apps/ui/app.js
          node apps/ui/audit.test.cjs
          node tests/dashboard_container_contract.cjs

      - name: Release packaging and hosted secret bootstrap regressions
        if: runner.os == 'Linux'
        run: |
          node tests/release_package_assets.cjs
          node tests/web_secret_bootstrap.cjs

  browser:
    name: Real Browser CSP Regressions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run actual Chromium dashboard regressions
        run: node apps/ui/csp.browser.test.cjs

  msrv:
    name: Minimum Supported Rust (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  contracts:
    name: Foundry Solidity Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Foundry Contract Tests
        run: forge test -vvv

  bench:
    name: Push Throughput Bench (ignored perf test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Run push bench (sequential vs concurrent)
        run: cargo test --locked -p ciphervault-cli --release --test push_bench -- --ignored --nocapture
