name: Edge Container Images

# Builds deployable GHCR images from main WITHOUT cutting a user-facing
# release, so cloud-only fixes (server behavior, container config) can be
# promoted without burning a full 6-target release matrix. See
# docs/RELEASE_PROCESS.md ("Edge images") for the promotion procedure.
#
# Cost guards: paths filter (server/container changes only), concurrency
# cancellation, and registry-layer caching. The web pair only (dashboard +
# account); the operator/maintenance fleet still ships with releases.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'crates/**'
      - 'deploy/docker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: edge-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-edge:
    name: Build edge ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ciphervault-dashboard
            dockerfile: deploy/docker/Dockerfile.dashboard
          - name: ciphervault-account
            dockerfile: deploy/docker/Dockerfile.account
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=main-

      - name: Build and Push Multi-Arch Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign Published Image Digest
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}"
