name: Security Scans

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        shell: bash
        run: |
          # One time-limited maintenance exception; vulnerabilities remain errors.
          # See docs/DEPENDENCY_AUDIT.md for the Linux libp2p dependency path.
          if [[ "$(date -u +%F)" > "2026-12-31" ]]; then
            echo "Review the expired RUSTSEC-2024-0436 maintenance exception before continuing."
            exit 1
          fi
          cargo audit --deny unsound --deny unmaintained --ignore RUSTSEC-2024-0436

  repository-scan:
    name: Repository vulnerability and secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Refuse a tracked local secret fixture
        shell: bash
        run: test -z "$(git ls-files -- secrets.env)"

      - name: Scan source tree with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: secrets.env
          skip-dirs: .git,target,dist,.ciphervault,secrets,operator-data-1,operator-data-2,operator-data-3
