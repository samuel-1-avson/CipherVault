name: CipherVault CI & Zero-Disk Secret Runner Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  validate-developer-suite:
    name: Developer Ergonomics & Synchronization Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dev-suite-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dev-suite-

      - name: Compile CipherVault CLI
        run: cargo build -p ciphervault-cli --release --locked

      - name: Add CipherVault to PATH
        run: echo "$(pwd)/target/release" >> $GITHUB_PATH

      - name: Test Shell Autocompletions Generation
        run: |
          ciphervault completions bash > /tmp/ciphervault.bash
          ciphervault completions zsh > /tmp/ciphervault.zsh
          ciphervault completions fish > /tmp/ciphervault.fish
          ciphervault completions powershell > /tmp/ciphervault.ps1
          ciphervault completions elvish > /tmp/ciphervault.elv
          echo "Generated all 5 shell autocompletions successfully!"

      - name: Test Encrypted Secret Diff Engine
        run: cargo test -p ciphervault-cli --test diff_test

      - name: Test Multi-Workstation Pull Synchronization
        run: cargo test -p ciphervault-cli --test pull_sync_test

      - name: Test In-Memory Zero-Disk Execution Suite
        run: cargo test -p ciphervault-cli --test run_injection_test

      - name: Setup Local Test Vault for Zero-Disk Runner
        run: |
          ciphervault init --force
          echo "ZERO_DISK_SECRET=verified_action_token_999" > .env.production
          ciphervault track .env.production
          ciphervault push --local -m "CI runner test snapshot"

      - name: Test Zero-Disk Injection Runner Action
        uses: ./.github/actions/ciphervault-run
        with:
          command: "node -e 'if (process.env.ZERO_DISK_SECRET !== \"verified_action_token_999\") { throw new Error(\"Secret injection failed\"); } console.log(\"Zero-disk test execution verified successfully!\");'"
          dry-run: "false"
          install-binary: "false"
