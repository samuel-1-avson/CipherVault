name: Release Matrix & Cross-Platform Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# Same-tag re-runs supersede each other so a re-pushed tag cannot
# double-publish or burn a second full matrix.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-release-gate:
    name: Mandatory Pre-Release Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Enforce Code Formatting
        run: cargo fmt --all -- --check

      - name: Enforce Strict Clippy Linting
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Execute Full Workspace Test Suite
        run: cargo test --workspace --locked --no-fail-fast

  build-release:
    name: Build ${{ matrix.target }}
    needs: pre-release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            suffix: ""
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: ""
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Per-target cache key: each matrix leg restores only its own
      # triple's artifacts instead of rebuilding all deps from scratch.
      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Pinned prebuilt binary: compiling cross from git source on every
      # release burned several minutes per cross leg.
      - name: Install Cross-Compilation Tools
        if: matrix.use_cross
        run: |
          set -euo pipefail
          CROSS_VERSION="v0.2.5"
          curl --fail --silent --show-error --location \
            "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/cross.tar.gz
          rm -rf /tmp/cross-bin && mkdir -p /tmp/cross-bin
          tar -xzf /tmp/cross.tar.gz -C /tmp/cross-bin
          CROSS_BIN="$(find /tmp/cross-bin -maxdepth 2 -name cross -type f | head -n 1)"
          test -n "$CROSS_BIN"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$CROSS_BIN" "$HOME/.cargo/bin/cross"
          cross --version

      - name: Build Release Binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p ciphervault-cli -p ciphervault-operator -p ciphervault-agent -p ciphervault-maintenance
          else
            cargo build --release --locked --target ${{ matrix.target }} -p ciphervault-cli -p ciphervault-operator -p ciphervault-agent -p ciphervault-maintenance
          fi

      - name: Package Release Archive
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          SUFFIX="${{ matrix.suffix }}"
          RELEASE="target/$TARGET/release"

          # Full bundle (backward compatible: in-app updater + existing installers)
          PKG_NAME="ciphervault-$TAG-$TARGET"
          mkdir -p "$PKG_NAME/bin" "$PKG_NAME/config" "$PKG_NAME/scripts"
          
          # Copy Binaries
          cp "$RELEASE/ciphervault$SUFFIX" "$PKG_NAME/bin/"
          cp "$RELEASE/ciphervault-operator$SUFFIX" "$PKG_NAME/bin/"
          cp "$RELEASE/ciphervault-agent$SUFFIX" "$PKG_NAME/bin/"
          cp "$RELEASE/ciphervault-maintenance$SUFFIX" "$PKG_NAME/bin/"
          
          # Copy Documentation and Configs
          cp README.md "$PKG_NAME/"
          cp -r dist/config/* "$PKG_NAME/config/" 2>/dev/null || true
          cp -r dist/scripts/* "$PKG_NAME/scripts/" 2>/dev/null || true

          # Developer bundle: day-to-day secrets CLI + file-watcher agent
          DEV_PKG="ciphervault-dev-$TAG-$TARGET"
          mkdir -p "$DEV_PKG/bin" "$DEV_PKG/scripts"
          cp "$RELEASE/ciphervault$SUFFIX" "$DEV_PKG/bin/"
          cp "$RELEASE/ciphervault-agent$SUFFIX" "$DEV_PKG/bin/"
          cp README.md "$DEV_PKG/"
          cp -r dist/scripts/* "$DEV_PKG/scripts/" 2>/dev/null || true

          # Node bundle: storage daemon + maintenance + CLI wrapper
          # (`ciphervault node setup` is the guided onboarding front door,
          # so the CLI ships here too).
          NODE_PKG="ciphervault-node-$TAG-$TARGET"
          mkdir -p "$NODE_PKG/bin" "$NODE_PKG/config" "$NODE_PKG/scripts"
          cp "$RELEASE/ciphervault$SUFFIX" "$NODE_PKG/bin/"
          cp "$RELEASE/ciphervault-operator$SUFFIX" "$NODE_PKG/bin/"
          cp "$RELEASE/ciphervault-maintenance$SUFFIX" "$NODE_PKG/bin/"
          cp README.md "$NODE_PKG/"
          cp -r dist/config/* "$NODE_PKG/config/" 2>/dev/null || true
          cp -r dist/scripts/* "$NODE_PKG/scripts/" 2>/dev/null || true
          
          # Create Archives (full + both role bundles)
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$PKG_NAME.zip" "$PKG_NAME"
            7z a "$DEV_PKG.zip" "$DEV_PKG"
            7z a "$NODE_PKG.zip" "$NODE_PKG"
          else
            tar -czvf "$PKG_NAME.tar.gz" "$PKG_NAME"
            tar -czvf "$DEV_PKG.tar.gz" "$DEV_PKG"
            tar -czvf "$NODE_PKG.tar.gz" "$NODE_PKG"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ciphervault-${{ github.ref_name }}-${{ matrix.target }}.*
            ciphervault-dev-${{ github.ref_name }}-${{ matrix.target }}.*
            ciphervault-node-${{ github.ref_name }}-${{ matrix.target }}.*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} dist-release/ \;
          # Extract standalone executables for direct downloads and the
          # in-app updater (one single-file binary per target, no extraction).
          if compgen -G "dist-release/ciphervault-*-x86_64-pc-windows-msvc.zip" > /dev/null; then
            unzip -j dist-release/ciphervault-*-x86_64-pc-windows-msvc.zip "*/bin/ciphervault.exe" -d dist-release/ 2>/dev/null || true
          fi
          if compgen -G "dist-release/ciphervault-*-x86_64-unknown-linux-gnu.tar.gz" > /dev/null; then
            tar -xzf dist-release/ciphervault-*-x86_64-unknown-linux-gnu.tar.gz --wildcards "*/bin/ciphervault" -O > dist-release/ciphervault-linux-amd64 2>/dev/null || true
            chmod +x dist-release/ciphervault-linux-amd64 2>/dev/null || true
          fi
          if compgen -G "dist-release/ciphervault-*-aarch64-unknown-linux-gnu.tar.gz" > /dev/null; then
            tar -xzf dist-release/ciphervault-*-aarch64-unknown-linux-gnu.tar.gz --wildcards "*/bin/ciphervault" -O > dist-release/ciphervault-linux-arm64 2>/dev/null || true
            chmod +x dist-release/ciphervault-linux-arm64 2>/dev/null || true
          fi
          if compgen -G "dist-release/ciphervault-*-x86_64-unknown-linux-musl.tar.gz" > /dev/null; then
            tar -xzf dist-release/ciphervault-*-x86_64-unknown-linux-musl.tar.gz --wildcards "*/bin/ciphervault" -O > dist-release/ciphervault-linux-amd64-musl 2>/dev/null || true
            chmod +x dist-release/ciphervault-linux-amd64-musl 2>/dev/null || true
          fi
          if compgen -G "dist-release/ciphervault-*-x86_64-apple-darwin.tar.gz" > /dev/null; then
            tar -xzf dist-release/ciphervault-*-x86_64-apple-darwin.tar.gz --wildcards "*/bin/ciphervault" -O > dist-release/ciphervault-macos-amd64 2>/dev/null || true
            chmod +x dist-release/ciphervault-macos-amd64 2>/dev/null || true
          fi
          if compgen -G "dist-release/ciphervault-*-aarch64-apple-darwin.tar.gz" > /dev/null; then
            tar -xzf dist-release/ciphervault-*-aarch64-apple-darwin.tar.gz --wildcards "*/bin/ciphervault" -O > dist-release/ciphervault-macos-arm64 2>/dev/null || true
            chmod +x dist-release/ciphervault-macos-arm64 2>/dev/null || true
          fi
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false  # Updater + installers resolve releases/latest, which only lists full releases

  publish-containers:
    name: Build & Publish Multi-Platform GHCR Images
    needs: pre-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ciphervault-operator
            dockerfile: deploy/docker/Dockerfile.operator
          - name: ciphervault-maintenance
            dockerfile: deploy/docker/Dockerfile.maintenance
          - name: ciphervault-dashboard
            dockerfile: deploy/docker/Dockerfile.dashboard
          - name: ciphervault-account
            dockerfile: deploy/docker/Dockerfile.account
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign Published Image Digest
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}"

