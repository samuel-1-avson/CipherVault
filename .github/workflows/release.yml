name: Release Matrix & Cross-Platform Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  pre-release-gate:
    name: Mandatory Pre-Release Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enforce Code Formatting
        run: cargo fmt --all -- --check

      - name: Enforce Strict Clippy Linting
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Execute Full Workspace Test Suite
        run: cargo test --workspace --locked --no-fail-fast

  build-release:
    name: Build ${{ matrix.target }}
    needs: pre-release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            suffix: ""
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: ""
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-Compilation Tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p ciphervault-cli -p ciphervault-operator -p ciphervault-agent -p ciphervault-maintenance
          else
            cargo build --release --locked --target ${{ matrix.target }} -p ciphervault-cli -p ciphervault-operator -p ciphervault-agent -p ciphervault-maintenance
          fi

      - name: Package Release Archive
        shell: bash
        run: |
          PKG_NAME="ciphervault-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME/bin" "$PKG_NAME/config" "$PKG_NAME/scripts"
          
          # Copy Binaries
          cp "target/${{ matrix.target }}/release/ciphervault${{ matrix.suffix }}" "$PKG_NAME/bin/"
          cp "target/${{ matrix.target }}/release/ciphervault-operator${{ matrix.suffix }}" "$PKG_NAME/bin/"
          cp "target/${{ matrix.target }}/release/ciphervault-agent${{ matrix.suffix }}" "$PKG_NAME/bin/"
          cp "target/${{ matrix.target }}/release/ciphervault-maintenance${{ matrix.suffix }}" "$PKG_NAME/bin/"
          
          # Copy Documentation and Configs
          cp README.md "$PKG_NAME/"
          cp -r dist/config/* "$PKG_NAME/config/" 2>/dev/null || true
          cp -r dist/scripts/* "$PKG_NAME/scripts/" 2>/dev/null || true
          
          # Create Archive
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$PKG_NAME.zip" "$PKG_NAME"
            echo "ASSET=$PKG_NAME.zip" >> $GITHUB_ENV
          else
            tar -czvf "$PKG_NAME.tar.gz" "$PKG_NAME"
            echo "ASSET=$PKG_NAME.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} dist-release/ \;
          # Extract standalone executables for direct downloads
          if compgen -G "dist-release/ciphervault-*-x86_64-pc-windows-msvc.zip" > /dev/null; then
            unzip -j dist-release/ciphervault-*-x86_64-pc-windows-msvc.zip "*/bin/ciphervault.exe" -d dist-release/ 2>/dev/null || true
          fi
          if compgen -G "dist-release/ciphervault-*-x86_64-unknown-linux-gnu.tar.gz" > /dev/null; then
            tar -xzf dist-release/ciphervault-*-x86_64-unknown-linux-gnu.tar.gz --wildcards "*/bin/ciphervault" -O > dist-release/ciphervault-linux-amd64 2>/dev/null || true
            chmod +x dist-release/ciphervault-linux-amd64 2>/dev/null || true
          fi
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-containers:
    name: Build & Publish Multi-Platform GHCR Images
    needs: pre-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ciphervault-operator
            dockerfile: deploy/docker/Dockerfile.operator
          - name: ciphervault-maintenance
            dockerfile: deploy/docker/Dockerfile.maintenance
          - name: ciphervault-dashboard
            dockerfile: deploy/docker/Dockerfile.dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

