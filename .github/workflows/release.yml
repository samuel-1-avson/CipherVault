name: Release Matrix & Cross-Platform Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            archive: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            suffix: ""
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: ""
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-Compilation Tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p ciphervault-cli -p ciphervault-operator -p ciphervault-agent -p ciphervault-maintenance
          else
            cargo build --release --target ${{ matrix.target }} -p ciphervault-cli -p ciphervault-operator -p ciphervault-agent -p ciphervault-maintenance
          fi

      - name: Package Release Archive
        shell: bash
        run: |
          PKG_NAME="ciphervault-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME/bin" "$PKG_NAME/config" "$PKG_NAME/scripts"
          
          # Copy Binaries
          cp "target/${{ matrix.target }}/release/ciphervault${{ matrix.suffix }}" "$PKG_NAME/bin/"
          cp "target/${{ matrix.target }}/release/ciphervault-operator${{ matrix.suffix }}" "$PKG_NAME/bin/"
          cp "target/${{ matrix.target }}/release/ciphervault-agent${{ matrix.suffix }}" "$PKG_NAME/bin/"
          cp "target/${{ matrix.target }}/release/ciphervault-maintenance${{ matrix.suffix }}" "$PKG_NAME/bin/"
          
          # Copy Documentation and Configs
          cp README.md "$PKG_NAME/"
          cp -r dist/config/* "$PKG_NAME/config/" 2>/dev/null || true
          cp -r dist/scripts/* "$PKG_NAME/scripts/" 2>/dev/null || true
          
          # Create Archive
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$PKG_NAME.zip" "$PKG_NAME"
            echo "ASSET=$PKG_NAME.zip" >> $GITHUB_ENV
          else
            tar -czvf "$PKG_NAME.tar.gz" "$PKG_NAME"
            echo "ASSET=$PKG_NAME.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} dist-release/ \;
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
