[package]
name = "d6-objstore"
version = "0.1.0"
edition = "2021"

# Standalone spike workspace: deliberately NOT a member of the CipherVault
# workspace, so its heavy/optional native deps never touch the main gates
# (`cargo test --workspace` from the repo root ignores this directory).
[workspace]

[features]
default = ["redb"]
redb = ["dep:redb"]
rocksdb = ["dep:rocksdb"]

[dependencies]
redb = { version = "4.3.0", optional = true }
rocksdb = { version = "0.25.0", optional = true }

[profile.release]
# Spike binaries are measured artifacts; keep default release profile.
