name: ciphervault
version: "0.7.3"
description: "Prove the model never saw it: zero-knowledge secret backup for AI coding agents — masked scan, policy-scoped RAM-only run, zero-knowledge env doctor & sealed-vault-safe secret generation, out-of-band secret prompt, ambient posture hooks, leak-guard hooks, and a hash-chained, fleet-anchored audit log."
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
license: MIT
homepage: https://github.com/samuel-1-avson/CipherVault
tags: [secrets, security, vault, backup, tools]
provides_tools:
  - ciphervault_status
  - ciphervault_scan
  - ciphervault_run
  - ciphervault_push
  - ciphervault_recovery_drill
  - ciphervault_redact
  - ciphervault_audit
  - ciphervault_env_doctor
  - ciphervault_secret_generate
  - ciphervault_diff
  - ciphervault_proxy_doctor
  - ciphervault_secret_prompt
  - ciphervault_restore_preview
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - transform_tool_result
  - post_tool_call
provides_middleware:
  - tool_request
config_schema:
  binary_path:
    type: str
    default: ""
    description: "Path to the ciphervault CLI binary (overrides $CIPHERVAULT_BIN, the bootstrapped copy, and PATH)"
    required: false
