name: ciphervault
version: "0.5.3"
description: "Prove the model never saw it: zero-knowledge secret backup for AI coding agents — masked scan, approval-gated RAM-only run, leak-guard hooks, and a hash-chained, fleet-anchored audit log of every guarded action."
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
license: MIT
homepage: https://github.com/samuel-1-avson/CipherVault
tags: [secrets, security, vault, backup, tools]
provides_tools:
  - ciphervault_status
  - ciphervault_scan
  - ciphervault_run
  - ciphervault_push
  - ciphervault_recovery_drill
  - ciphervault_redact
  - ciphervault_audit
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - post_tool_call
provides_middleware:
  - tool_request
config_schema:
  binary_path:
    type: str
    default: ""
    description: "Path to the ciphervault CLI binary (overrides $CIPHERVAULT_BIN, the bootstrapped copy, and PATH)"
    required: false
