services:
  ingress:
    image: caddy:2-alpine
    container_name: ciphervault-ingress
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - TLS_MODE=${TLS_MODE:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ciphervault-prod-net
    depends_on:
      operator-1:
        condition: service_healthy
      operator-2:
        condition: service_healthy
      operator-3:
        condition: service_healthy
    restart: unless-stopped

  operator-1:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.operator
    container_name: ciphervault-operator-1
    command: ["--port", "8201", "--data-dir", "/var/lib/ciphervault", "--operator-id", "op_8201"]
    volumes:
      - op1_prod_data:/var/lib/ciphervault
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8201/v1/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  operator-2:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.operator
    container_name: ciphervault-operator-2
    command: ["--port", "8202", "--data-dir", "/var/lib/ciphervault", "--operator-id", "op_8202"]
    volumes:
      - op2_prod_data:/var/lib/ciphervault
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8202/v1/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  operator-3:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.operator
    container_name: ciphervault-operator-3
    command: ["--port", "8203", "--data-dir", "/var/lib/ciphervault", "--operator-id", "op_8203"]
    volumes:
      - op3_prod_data:/var/lib/ciphervault
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8203/v1/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  maintenance:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.maintenance
    container_name: ciphervault-maintenance
    command: [
      "--operators",
      "http://operator-1:8201",
      "http://operator-2:8202",
      "http://operator-3:8203",
      "--interval-secs",
      "15",
      "--db",
      "/var/lib/ciphervault/fleet.db"
    ]
    volumes:
      - maintenance_prod_data:/var/lib/ciphervault
    depends_on:
      operator-1:
        condition: service_healthy
      operator-2:
        condition: service_healthy
      operator-3:
        condition: service_healthy
    networks:
      - ciphervault-prod-net
    restart: unless-stopped

networks:
  ciphervault-prod-net:
    driver: bridge

volumes:
  op1_prod_data:
  op2_prod_data:
  op3_prod_data:
  maintenance_prod_data:
  caddy_data:
  caddy_config:
