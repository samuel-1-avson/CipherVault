services:
  ingress:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: ciphervault-ingress
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - TLS_MODE=${TLS_MODE:-internal}
      - OPERATOR_DOMAIN_1=${OPERATOR_DOMAIN_1:-op1.ciphervault.internal}
      - OPERATOR_DOMAIN_2=${OPERATOR_DOMAIN_2:-op2.ciphervault.internal}
      - OPERATOR_DOMAIN_3=${OPERATOR_DOMAIN_3:-op3.ciphervault.internal}
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-dashboard.ciphervault.internal}
      - OPERATOR_UPSTREAM_1=operator-1:8201
      - OPERATOR_UPSTREAM_2=operator-2:8202
      - OPERATOR_UPSTREAM_3=operator-3:8203
      - DASHBOARD_UPSTREAM=dashboard:8080
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ciphervault-prod-net
    depends_on:
      operator-1:
        condition: service_healthy
      operator-2:
        condition: service_healthy
      operator-3:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    restart: unless-stopped

  operator-1:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.operator
    container_name: ciphervault-operator-1
    environment:
      - CIPHERVAULT_OPERATOR_STRICT_AUTH=${CIPHERVAULT_OPERATOR_STRICT_AUTH:-true}
      - CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT=${CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT:-true}
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
    command: ["--port", "8201", "--data-dir", "/var/lib/ciphervault", "--operator-id", "op_8201"]
    volumes:
      - op1_prod_data:/var/lib/ciphervault
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8201/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  operator-2:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.operator
    container_name: ciphervault-operator-2
    environment:
      - CIPHERVAULT_OPERATOR_STRICT_AUTH=${CIPHERVAULT_OPERATOR_STRICT_AUTH:-true}
      - CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT=${CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT:-true}
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
    command: ["--port", "8202", "--data-dir", "/var/lib/ciphervault", "--operator-id", "op_8202"]
    volumes:
      - op2_prod_data:/var/lib/ciphervault
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8202/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  operator-3:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.operator
    container_name: ciphervault-operator-3
    environment:
      - CIPHERVAULT_OPERATOR_STRICT_AUTH=${CIPHERVAULT_OPERATOR_STRICT_AUTH:-true}
      - CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT=${CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT:-true}
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
    command: ["--port", "8203", "--data-dir", "/var/lib/ciphervault", "--operator-id", "op_8203"]
    volumes:
      - op3_prod_data:/var/lib/ciphervault
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8203/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  maintenance:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.maintenance
    container_name: ciphervault-maintenance
    environment:
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
    command: [
      "--operators",
      "http://operator-1:8201",
      "http://operator-2:8202",
      "http://operator-3:8203",
      "--interval-secs",
      "15",
      "--db",
      "/var/lib/ciphervault/fleet.db"
    ]
    volumes:
      - maintenance_prod_data:/var/lib/ciphervault
    depends_on:
      operator-1:
        condition: service_healthy
      operator-2:
        condition: service_healthy
      operator-3:
        condition: service_healthy
    networks:
      - ciphervault-prod-net
    restart: unless-stopped

  account:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.account
    container_name: ciphervault-account
    environment:
      - CIPHERVAULT_ACCOUNT_BIND=0.0.0.0:8300
      - CIPHERVAULT_ACCOUNT_DATA_DIR=/var/lib/ciphervault-account
      - CIPHERVAULT_ACCOUNT_ALLOWED_ORIGINS=${CIPHERVAULT_ACCOUNT_ALLOWED_ORIGINS:-}
      - CIPHERVAULT_ACCOUNT_TRUST_PROXY_HEADERS=${CIPHERVAULT_ACCOUNT_TRUST_PROXY_HEADERS:-true}
      - CIPHERVAULT_WEBAUTHN_RP_ID=${CIPHERVAULT_WEBAUTHN_RP_ID:-localhost}
      - CIPHERVAULT_WEBAUTHN_ORIGIN=${CIPHERVAULT_WEBAUTHN_ORIGIN:-http://localhost:8300}
      - CIPHERVAULT_ACCOUNT_COOKIE_SECURE=${CIPHERVAULT_ACCOUNT_COOKIE_SECURE:-true}
      - CIPHERVAULT_ACCOUNT_TOTP_KEY_FILE=/run/secrets/account-totp-key
      - CIPHERVAULT_ACCOUNT_REQUIRE_TOTP_KEY=${CIPHERVAULT_ACCOUNT_REQUIRE_TOTP_KEY:-true}
      - CIPHERVAULT_OPERATOR_ENDPOINTS=http://operator-1:8201,http://operator-2:8202,http://operator-3:8203
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
    volumes:
      - account_prod_data:/var/lib/ciphervault-account
    secrets:
      - source: account_totp_key
        target: account-totp-key
        uid: "10001"
        gid: "10001"
        mode: 0400
    depends_on:
      operator-1:
        condition: service_healthy
      operator-2:
        condition: service_healthy
      operator-3:
        condition: service_healthy
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8300/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.dashboard
    container_name: ciphervault-dashboard
    environment:
      - CIPHERVAULT_OPERATORS=http://operator-1:8201 http://operator-2:8202 http://operator-3:8203
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
      - CIPHERVAULT_TRUSTED_OPERATOR_IDENTITIES=${CIPHERVAULT_TRUSTED_OPERATOR_IDENTITIES:-}
      - CIPHERVAULT_PUBLIC_CHECKPOINT_FEED=${CIPHERVAULT_PUBLIC_CHECKPOINT_FEED:-}
      - CIPHERVAULT_PUBLIC_OPERATOR_TELEMETRY_FILE=${CIPHERVAULT_PUBLIC_OPERATOR_TELEMETRY_FILE:-/var/lib/ciphervault-ui/operator-telemetry.json}
      - CIPHERVAULT_OPERATOR_REGIONS=${CIPHERVAULT_OPERATOR_REGIONS:-}
      - CIPHERVAULT_ACCOUNT_ENDPOINT=${CIPHERVAULT_ACCOUNT_ENDPOINT:-http://account:8300}
    volumes:
      - dashboard_prod_data:/var/lib/ciphervault-ui
    depends_on:
      operator-1:
        condition: service_healthy
      operator-2:
        condition: service_healthy
      operator-3:
        condition: service_healthy
      account:
        condition: service_healthy
    networks:
      - ciphervault-prod-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/vault || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Enable with `docker compose --profile public-feed up` after setting the
  # publisher key and pointing CIPHERVAULT_PUBLIC_CHECKPOINT_FEED at the
  # generated file in the shared volume.
  public-feed-publisher:
    profiles: ["public-feed"]
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.dashboard
    container_name: ciphervault-public-feed-publisher
    entrypoint: ["/usr/local/bin/entrypoint-public-feed-publisher.sh"]
    environment:
      - CIPHERVAULT_PUBLIC_CHECKPOINT_SIGNING_KEY_HEX=${CIPHERVAULT_PUBLIC_CHECKPOINT_SIGNING_KEY_HEX:-}
      - CIPHERVAULT_PUBLIC_FEED_OUTPUT=${CIPHERVAULT_PUBLIC_FEED_OUTPUT:-/var/lib/ciphervault-ui/public-checkpoint-feed.json}
      - CIPHERVAULT_PUBLIC_FEED_NETWORK=${CIPHERVAULT_PUBLIC_FEED_NETWORK:-Arbitrum One}
      - CIPHERVAULT_PUBLIC_FEED_INTERVAL_SECS=${CIPHERVAULT_PUBLIC_FEED_INTERVAL_SECS:-60}
    volumes:
      - dashboard_prod_data:/var/lib/ciphervault-ui
    networks:
      - ciphervault-prod-net
    restart: unless-stopped

networks:
  ciphervault-prod-net:
    driver: bridge

volumes:
  op1_prod_data:
  op2_prod_data:
  op3_prod_data:
  maintenance_prod_data:
  dashboard_prod_data:
  account_prod_data:
  caddy_data:
  caddy_config:

secrets:
  account_totp_key:
    file: ${CIPHERVAULT_ACCOUNT_TOTP_KEY_FILE:-/run/ciphervault-account-totp-key}
