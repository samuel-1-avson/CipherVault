# ==============================================================================
# CipherVault Production Nginx Ingress & mTLS Configuration
# ==============================================================================

# Rate Limiting Zone: 50 requests/second per client IP with burst allowance
limit_req_zone $binary_remote_addr zone=ciphervault_limit:10m rate=50r/s;

upstream operator_1_backend {
    server operator-1:8201 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream operator_2_backend {
    server operator-2:8202 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream operator_3_backend {
    server operator-3:8203 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name op1.ciphervault.internal;

    # TLS 1.3 Configuration
    ssl_certificate /etc/nginx/certs/operator.crt;
    ssl_certificate_key /etc/nginx/certs/operator.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Mutual TLS (mTLS) - Optional enterprise client authentication
    # Uncomment to enforce client certificate verification:
    # ssl_client_certificate /etc/nginx/certs/ca.crt;
    # ssl_verify_client on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Do not compress encrypted ciphertext payload (saves CPU)
    gzip off;

    # Maximum payload size (4 MiB object limit + envelope overhead)
    client_max_body_size 4M;
    client_body_buffer_size 128k;

    location / {
        limit_req zone=ciphervault_limit burst=20 nodelay;

        proxy_pass http://operator_1_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
