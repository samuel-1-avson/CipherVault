apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciphervaultsecrets.csi.ciphervault.io
spec:
  group: csi.ciphervault.io
  names:
    kind: CipherVaultSecret
    listKind: CipherVaultSecretList
    plural: ciphervaultsecrets
    singular: ciphervaultsecret
    shortNames:
      - cvsec
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - project
                - environment
              properties:
                project:
                  type: string
                  description: "CipherVault project identifier or slug"
                environment:
                  type: string
                  description: "Environment stage name (e.g. production, staging)"
                revision:
                  type: string
                  description: "Pinned snapshot hash or scope revision; defaults to latest head"
                secretFiles:
                  type: array
                  description: "Specific confidential files to materialize into the ephemeral volume"
                  items:
                    type: string
                keys:
                  type: array
                  description: "Specific environment variable keys to extract into individual files"
                  items:
                    type: object
                    required:
                      - key
                      - path
                    properties:
                      key:
                        type: string
                      path:
                        type: string
                memoryOnly:
                  type: boolean
                  default: true
                  description: "Enforce zero-disk in-memory tmpfs mount (never write to node storage)"
            status:
              type: object
              properties:
                lastSynchronized:
                  type: string
                  format: date-time
                activeRevision:
                  type: string
                mountCount:
                  type: integer
