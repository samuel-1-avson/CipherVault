services:
  operator:
    image: ghcr.io/samuel-1-avson/ciphervault-operator:latest
    container_name: ciphervault-operator
    restart: always
    network_mode: host
    environment:
      - CIPHERVAULT_OPERATOR_STRICT_AUTH=${CIPHERVAULT_OPERATOR_STRICT_AUTH:-true}
      - CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT=${CIPHERVAULT_OPERATOR_REQUIRE_ENROLLMENT:-true}
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
    command: ["--port", "8201", "--data-dir", "/var/lib/ciphervault", "--operator-id", "${OPERATOR_ID:-operator-gcp}"]
    volumes:
      - /opt/ciphervault/data:/var/lib/ciphervault
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8201/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: ciphervault-caddy
    restart: always
    network_mode: host
    volumes:
      - /opt/ciphervault/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/ciphervault/caddy_data:/data
      - /opt/ciphervault/caddy_config:/config
    depends_on:
      - operator
