services:
  ciphervault-ui:
    image: ${CIPHERVAULT_DASHBOARD_IMAGE:?CIPHERVAULT_DASHBOARD_IMAGE must be a signed GHCR digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - CIPHERVAULT_OPERATORS=${CIPHERVAULT_OPERATORS:?CIPHERVAULT_OPERATORS must list private operator endpoints}
      # Behind the edge Caddy: key the in-app limiter on the XFF address Caddy appends.
      - CIPHERVAULT_TRUST_XFF=${CIPHERVAULT_TRUST_XFF:-1}
      - CIPHERVAULT_TRUSTED_OPERATOR_IDENTITIES=${CIPHERVAULT_TRUSTED_OPERATOR_IDENTITIES:-}
      - CIPHERVAULT_PUBLIC_CHECKPOINT_FEED=${CIPHERVAULT_PUBLIC_CHECKPOINT_FEED:-}
      - CIPHERVAULT_PUBLIC_OPERATOR_TELEMETRY_FILE=${CIPHERVAULT_PUBLIC_OPERATOR_TELEMETRY_FILE:-/var/lib/ciphervault-ui/operator-telemetry.json}
      - CIPHERVAULT_OPERATOR_REGIONS=${CIPHERVAULT_OPERATOR_REGIONS:-}
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
      - CIPHERVAULT_ACCOUNT_ENDPOINT=${CIPHERVAULT_ACCOUNT_ENDPOINT:-http://account:8300}
      - CIPHERVAULT_ARBITRUM_RPC_URL=${CIPHERVAULT_ARBITRUM_RPC_URL:-}
      - RUST_LOG=info
    volumes:
      - vault_data:/var/lib/ciphervault-ui
      # Read-only release view so the dashboard can load the staged
      # checkpoint feed (CIPHERVAULT_PUBLIC_CHECKPOINT_FEED=/release/feed.json).
      # Directory (not file) mount: the feed is optional, and a missing
      # file bind would fail container creation on feed-less deploys.
      - /opt/ciphervault-ui/release:/release:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/api/vault"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  account:
    image: ${CIPHERVAULT_ACCOUNT_IMAGE:?CIPHERVAULT_ACCOUNT_IMAGE must be a signed GHCR digest}
    restart: unless-stopped
    environment:
      - CIPHERVAULT_ACCOUNT_BIND=0.0.0.0:8300
      - CIPHERVAULT_ACCOUNT_DATA_DIR=/var/lib/ciphervault-account
      - CIPHERVAULT_ACCOUNT_ALLOWED_ORIGINS=${CIPHERVAULT_ACCOUNT_ALLOWED_ORIGINS:-}
      - CIPHERVAULT_ACCOUNT_TRUST_PROXY_HEADERS=${CIPHERVAULT_ACCOUNT_TRUST_PROXY_HEADERS:-true}
      - CIPHERVAULT_WEBAUTHN_RP_ID=${CIPHERVAULT_WEBAUTHN_RP_ID:-localhost}
      - CIPHERVAULT_WEBAUTHN_ORIGIN=${CIPHERVAULT_WEBAUTHN_ORIGIN:-http://localhost:8300}
      - CIPHERVAULT_ACCOUNT_COOKIE_SECURE=${CIPHERVAULT_ACCOUNT_COOKIE_SECURE:-true}
      - CIPHERVAULT_ACCOUNT_TOTP_KEY_FILE=/run/secrets/account-totp-key
      - CIPHERVAULT_ACCOUNT_REQUIRE_TOTP_KEY=${CIPHERVAULT_ACCOUNT_REQUIRE_TOTP_KEY:-true}
      - CIPHERVAULT_OPERATOR_ENDPOINTS=${CIPHERVAULT_OPERATOR_ENDPOINTS:-}
      - CIPHERVAULT_OPERATOR_SERVICE_TOKEN=${CIPHERVAULT_OPERATOR_SERVICE_TOKEN:-}
    volumes:
      - account_data:/var/lib/ciphervault-account
    secrets:
      - source: account_totp_key
        target: account-totp-key
        uid: "10001"
        gid: "10001"
        mode: 0400
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8300/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  public-feed-publisher:
    profiles: ["public-feed"]
    image: ${CIPHERVAULT_DASHBOARD_IMAGE:?CIPHERVAULT_DASHBOARD_IMAGE must be a signed GHCR digest}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint-public-feed-publisher.sh"]
    environment:
      - CIPHERVAULT_PUBLIC_CHECKPOINT_SIGNING_KEY_HEX=${CIPHERVAULT_PUBLIC_CHECKPOINT_SIGNING_KEY_HEX:-}
      - CIPHERVAULT_PUBLIC_FEED_OUTPUT=${CIPHERVAULT_PUBLIC_FEED_OUTPUT:-/var/lib/ciphervault-ui/public-checkpoint-feed.json}
      - CIPHERVAULT_PUBLIC_FEED_NETWORK=${CIPHERVAULT_PUBLIC_FEED_NETWORK:-Arbitrum One}
      - CIPHERVAULT_PUBLIC_FEED_INTERVAL_SECS=${CIPHERVAULT_PUBLIC_FEED_INTERVAL_SECS:-60}
    volumes:
      - vault_data:/var/lib/ciphervault-ui

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    network_mode: host
    environment:
      - WEB_DOMAIN=${WEB_DOMAIN:-vault.example.com}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - OPERATOR_GATEWAY_UPSTREAM_1=${OPERATOR_GATEWAY_UPSTREAM_1:-10.128.0.39:80}
      - OPERATOR_GATEWAY_UPSTREAM_2=${OPERATOR_GATEWAY_UPSTREAM_2:-10.128.0.40:80}
      - OPERATOR_GATEWAY_UPSTREAM_3=${OPERATOR_GATEWAY_UPSTREAM_3:-10.142.0.2:80}
    volumes:
      - /opt/ciphervault-ui/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ciphervault-ui:
        condition: service_healthy
      account:
        condition: service_healthy

volumes:
  vault_data:
  account_data:
  caddy_data:
  caddy_config:

secrets:
  account_totp_key:
    file: ${CIPHERVAULT_ACCOUNT_TOTP_KEY_FILE:-/run/ciphervault-account-totp-key}
