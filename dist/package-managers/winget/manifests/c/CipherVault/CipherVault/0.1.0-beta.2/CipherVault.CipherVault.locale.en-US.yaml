ShortDescription: Decentralized, encrypted version control for confidential files
Description: |
  CipherVault provides decentralized, authenticated, and encrypted version control
  for confidential files (.env, credentials, TLS certificates, secrets).
  Featuring libsodium XChaCha20-Poly1305 AEAD encryption, Argon2id key derivation,
  multi-operator redundant ciphertext replication with readback verification,
  automated self-repair, offline emergency recovery kits, and Arbitrum One
  checkpoint anchoring.
