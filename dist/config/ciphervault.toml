# CipherVault Client Configuration (v0.1.0)

[vault]
# The vault ID is initialized automatically via `ciphervault init`
# Or can be set explicitly as a 64-character hex string.
debounce_seconds = 5

[operators]
# Three independent storage operator endpoints for multi-operator replication
endpoints = [
    "http://127.0.0.1:8201",
    "http://127.0.0.1:8202",
    "http://127.0.0.1:8203"
]

[chain]
# CipherChain Sovereign Ledger Configuration (zero-gas PoA, no EVM).
network = "ciphervault-sovereign-1"
chain_id = 777777
timeout_seconds = 15
