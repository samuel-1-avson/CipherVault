/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.cap{position:absolute;left:50%;bottom:44px;max-width:1500px;text-align:center;font-size:33px;font-weight:550;line-height:1.3;letter-spacing:-.008em;white-space:nowrap;
  color:#151B2B;background:rgba(248,250,253,.86);backdrop-filter:blur(14px);padding:12px 26px;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 28px rgba(30,45,80,.16)}
.cap.dk{color:#E7EBF3;background:rgba(13,18,32,.84);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 28px rgba(0,0,0,.45)}
.cap em{font-style:normal;color:#B26B00}.cap.dk em{color:#F5B544}
.cap code{font-family:Mono;font-size:30px;font-weight:600}
.keys{position:absolute;right:56px;bottom:48px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#fff;background:rgba(15,20,32,.9);padding:10px 14px;border-radius:14px}
.keys i{font-style:normal;min-width:38px;height:38px;padding:0 10px;border-radius:8px;background:#2A3346;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.45);font-size:17px}
.keys i.dn{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.45);background:#F5A524;color:#1B1A17}
.keys span{margin-left:6px;color:#C8D0DE;font-weight:500}
.chap{position:absolute;left:56px;top:46px;display:flex;align-items:center;gap:14px;font-size:28px;font-weight:650;letter-spacing:-.01em;color:#151B2B;background:rgba(248,250,253,.9);padding:10px 20px 10px 12px;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 28px rgba(30,45,80,.14);white-space:nowrap}
.chap.dk{color:#E7EBF3;background:rgba(13,18,32,.86)}
.chap b{font-family:Mono;font-size:15px;font-weight:700;color:#1B1A17;background:#F5A524;border-radius:7px;padding:5px 9px}
.ramp{position:absolute;right:56px;top:46px;font-family:Mono;font-size:22px;font-weight:700;color:#1B1A17;background:#F5A524;padding:8px 14px;border-radius:10px}
.wipe{position:absolute;inset:0}.wipe b{position:absolute;display:block}
.wlabel{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#F1F5FB;white-space:nowrap}
.wlabel .no{font-family:Mono;font-size:28px;font-weight:700;letter-spacing:.24em;color:#F5A524;margin-bottom:12px}
.wlabel .nm{font-size:104px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.spot{position:absolute;inset:0}
.fade{position:absolute;inset:0;background:#0B0F1A}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter></svg>
<div id="stage">
  <div id="mbw" style="position:absolute;inset:0">
    <div id="wL" class="layer world th"></div>
    <div id="wD" class="layer world th dark"></div>
    <div id="spr" class="layer" style="z-index:5"></div>
  </div>
  <div id="hud"></div>
</div>
<script type="module" src="main.js"></script>
</body></html>
