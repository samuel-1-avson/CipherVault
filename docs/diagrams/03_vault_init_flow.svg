<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <marker id="mArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="mArrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="mArrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Workflow 1: Vault Initialization Sequence (`ciphervault init`)</text>
  <text x="460" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Zero-Disk Recovery Kit Generation, DPAPI Keyring Protection &amp; Immediate Memory Scrubbing</text>

  <!-- Lifelines -->
  <!-- 1: Developer -->
  <rect x="30" y="70" width="120" height="36" rx="6" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="90" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Developer</text>
  <line x1="90" y1="106" x2="90" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 2: CLI Engine -->
  <rect x="180" y="70" width="120" height="36" rx="6" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="240" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">CipherVault CLI</text>
  <line x1="240" y1="106" x2="240" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 3: Crypto Engine -->
  <rect x="330" y="70" width="130" height="36" rx="6" fill="url(#pGrad)" stroke="#f59e0b" stroke-width="1.2" />
  <text x="395" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Crypto Engine</text>
  <line x1="395" y1="106" x2="395" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 4: OS Keyring (DPAPI) -->
  <rect x="490" y="70" width="130" height="36" rx="6" fill="url(#pGrad)" stroke="#a78bfa" stroke-width="1.2" />
  <text x="555" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">OS Keyring (DPAPI)</text>
  <line x1="555" y1="106" x2="555" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 5: Local SQLite Store -->
  <rect x="650" y="70" width="120" height="36" rx="6" fill="url(#pGrad)" stroke="#34d399" stroke-width="1.2" />
  <text x="710" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">vault.db (WAL)</text>
  <line x1="710" y1="106" x2="710" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 6: Terminal Stdout -->
  <rect x="795" y="70" width="105" height="36" rx="6" fill="url(#pGrad)" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="847" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Terminal Stdout</text>
  <line x1="847" y1="106" x2="847" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Steps -->
  <!-- Step 1 -->
  <line x1="90" y1="130" x2="236" y2="130" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mArr)" />
  <text x="165" y="123" text-anchor="middle" fill="#f8fafc" font-size="10">1: ciphervault init</text>

  <!-- Step 2 -->
  <line x1="240" y1="160" x2="391" y2="160" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#mArrAmber)" />
  <text x="315" y="153" text-anchor="middle" fill="#f59e0b" font-size="10">2: Generate R (OsRng, 32B)</text>

  <!-- Step 3: Self-call on Crypto Engine -->
  <path d="M 395 175 C 445 175, 445 210, 399 210" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#mArrAmber)" />
  <text x="445" y="195" text-anchor="start" fill="#94a3b8" font-size="9">3: Derive (R_SK, R_PK), (E_SK, E_PK), L, Epoch 1 Key</text>

  <!-- Step 4 -->
  <line x1="240" y1="235" x2="551" y2="235" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#mArr)" />
  <text x="395" y="228" text-anchor="middle" fill="#a78bfa" font-size="10">4: CryptProtectData(DeviceSigningKey, EpochKey)</text>

  <!-- Step 5 -->
  <line x1="555" y1="260" x2="244" y2="260" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArr)" />
  <text x="395" y="253" text-anchor="middle" fill="#94a3b8" font-size="9">5: Return DPAPI Ciphertext Blobs</text>

  <!-- Step 6 -->
  <line x1="240" y1="285" x2="706" y2="285" stroke="#34d399" stroke-width="1.5" marker-end="url(#mArrGreen)" />
  <text x="475" y="278" text-anchor="middle" fill="#34d399" font-size="10">6: Persist encrypted credentials, device cert, operators in SQLite WAL</text>

  <!-- Step 7 -->
  <line x1="240" y1="320" x2="843" y2="320" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#mArr)" />
  <text x="540" y="313" text-anchor="middle" fill="#f8fafc" font-size="10">7: Print Emergency Recovery Kit (Secret R + Checksum) to stdout</text>

  <!-- Step 8 -->
  <line x1="847" y1="355" x2="94" y2="355" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#mArrAmber)" />
  <text x="470" y="348" text-anchor="middle" fill="#f59e0b" font-size="10">8: Interactive Prompt: "Record this kit immediately. Have you secured it?"</text>

  <!-- Step 9 -->
  <line x1="90" y1="385" x2="236" y2="385" stroke="#34d399" stroke-width="1.5" marker-end="url(#mArrGreen)" />
  <text x="165" y="378" text-anchor="middle" fill="#34d399" font-size="10">9: Confirmed ("yes")</text>

  <!-- Step 10 -->
  <line x1="240" y1="415" x2="391" y2="415" stroke="#ef4444" stroke-width="1.5" marker-end="url(#mArr)" />
  <text x="315" y="408" text-anchor="middle" fill="#ef4444" font-size="10">10: Zeroize R from RAM (ZeroizeOnDrop)</text>

  <!-- Step 11 -->
  <line x1="240" y1="445" x2="94" y2="445" stroke="#34d399" stroke-width="1.5" marker-end="url(#mArrGreen)" />
  <text x="165" y="438" text-anchor="middle" fill="#34d399" font-size="10">11: ✓ Vault Initialized</text>

</svg>
