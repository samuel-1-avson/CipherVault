<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>

    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">CipherVault Cryptographic Key Derivation Hierarchy</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Domain-Separated HKDF-BLAKE2b Branching &amp; Zero-Knowledge Envelope Sealing</text>

  <!-- ROOT NODE: Master Recovery Secret R -->
  <g filter="url(#dropShadow)">
    <rect x="330" y="80" width="300" height="64" rx="10" fill="url(#rootGrad)" stroke="#f59e0b" stroke-width="2" />
    <text x="480" y="107" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Master Recovery Secret (R)</text>
    <text x="480" y="127" text-anchor="middle" fill="#fef3c7" font-size="11">256-Bit High-Entropy Seed &bull; Never Persisted Unencrypted</text>
  </g>

  <!-- ================= BRANCH 1: RECOVERY IDENTITIES (LEFT) ================= -->
  <rect x="40" y="180" width="270" height="340" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,4" />
  <rect x="55" y="170" width="180" height="22" rx="4" fill="#047857" />
  <text x="145" y="185" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">RECOVERY IDENTITIES (PUBLIC)</text>

  <!-- R_SK & R_PK -->
  <g filter="url(#dropShadow)">
    <rect x="55" y="205" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#34d399" stroke-width="1.2" />
    <text x="175" y="227" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Recovery Signing Keypair</text>
    <text x="175" y="245" text-anchor="middle" fill="#34d399" font-size="10">Ed25519 &bull; Signs DeviceCertificate</text>
  </g>

  <!-- E_SK & E_PK -->
  <g filter="url(#dropShadow)">
    <rect x="55" y="280" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#34d399" stroke-width="1.2" />
    <text x="175" y="302" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Recovery Encryption Keypair</text>
    <text x="175" y="320" text-anchor="middle" fill="#34d399" font-size="10">X25519 &bull; Target for Epoch Envelopes</text>
  </g>

  <!-- LOCATOR -->
  <g filter="url(#dropShadow)">
    <rect x="55" y="355" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#34d399" stroke-width="1.2" />
    <text x="175" y="377" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Public Recovery Locator (L)</text>
    <text x="175" y="395" text-anchor="middle" fill="#6ee7b7" font-size="10">BLAKE2b(R, "locator") [32 Bytes]</text>
  </g>

  <!-- Shamir Guardian Shares -->
  <g filter="url(#dropShadow)">
    <rect x="55" y="430" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="175" y="452" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">M-of-N Threshold Shares</text>
    <text x="175" y="470" text-anchor="middle" fill="#a7f3d0" font-size="10">Shamir GF(2^8) Lagrange Polynomial</text>
  </g>

  <!-- ================= BRANCH 2: EPOCH & CHUNK HIERARCHY (CENTER) ================= -->
  <rect x="345" y="180" width="270" height="340" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" />
  <rect x="360" y="170" width="180" height="22" rx="4" fill="#0369a1" />
  <text x="450" y="185" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">ACTIVE EPOCH ENCRYPTION</text>

  <!-- Vault Epoch Key -->
  <g filter="url(#dropShadow)">
    <rect x="360" y="205" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="480" y="227" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Vault Epoch Key</text>
    <text x="480" y="245" text-anchor="middle" fill="#38bdf8" font-size="10">HKDF(R, "epoch_1") &bull; ChaCha20</text>
  </g>

  <!-- Epoch Envelope -->
  <g filter="url(#dropShadow)">
    <rect x="360" y="280" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#0284c7" stroke-width="1.2" />
    <text x="480" y="302" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Sealed Epoch Envelope</text>
    <text x="480" y="320" text-anchor="middle" fill="#94a3b8" font-size="10">X25519 Sealed Box (Stored on Ops)</text>
  </g>

  <!-- File Version Key -->
  <g filter="url(#dropShadow)">
    <rect x="360" y="355" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="480" y="377" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">File Version Key (FVK)</text>
    <text x="480" y="395" text-anchor="middle" fill="#38bdf8" font-size="10">HKDF(EpochKey, VaultID, Digest)</text>
  </g>

  <!-- Chunk Nonce -->
  <g filter="url(#dropShadow)">
    <rect x="360" y="430" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="480" y="452" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Deterministic Chunk Nonce</text>
    <text x="480" y="470" text-anchor="middle" fill="#bae6fd" font-size="10">HKDF(FVK, ChunkIdx, Plaintext) [12B]</text>
  </g>

  <!-- ================= BRANCH 3: DEVICE IDENTITY (RIGHT) ================= -->
  <rect x="650" y="180" width="270" height="340" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,4" />
  <rect x="665" y="170" width="180" height="22" rx="4" fill="#6d28d9" />
  <text x="755" y="185" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">WORKSTATION / DEVICE IDENTITY</text>

  <!-- Device Signing Key -->
  <g filter="url(#dropShadow)">
    <rect x="665" y="205" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#a78bfa" stroke-width="1.2" />
    <text x="785" y="227" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Device Signing Keypair</text>
    <text x="785" y="245" text-anchor="middle" fill="#a78bfa" font-size="10">Ed25519 &bull; DPAPI or YubiKey Slot 9C</text>
  </g>

  <!-- Device Certificate -->
  <g filter="url(#dropShadow)">
    <rect x="665" y="280" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#a78bfa" stroke-width="1.2" />
    <text x="785" y="302" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">DeviceCertificate</text>
    <text x="785" y="320" text-anchor="middle" fill="#c4b5fd" font-size="10">Signed by R_SK &bull; Authorizes Operator Writes</text>
  </g>

  <!-- Snapshot Head Signing -->
  <g filter="url(#dropShadow)">
    <rect x="665" y="355" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="785" y="377" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">HeadRecord Signature</text>
    <text x="785" y="395" text-anchor="middle" fill="#ddd6fe" font-size="10">Signed with DeviceKey or Touch APDU</text>
  </g>

  <g filter="url(#dropShadow)">
    <rect x="665" y="430" width="240" height="58" rx="6" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="785" y="452" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Operator Access Token</text>
    <text x="785" y="470" text-anchor="middle" fill="#ddd6fe" font-size="10">HMAC-SHA256 Token with Expiry</text>
  </g>

  <!-- CONNECTING ARROWS FROM ROOT -->
  <!-- To Left Branch -->
  <path d="M 380 144 L 175 160 L 175 200" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#arrAmber)" />
  <!-- To Center Branch -->
  <path d="M 480 144 L 480 200" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrCyan)" />
  <!-- To Right Branch (Cert Signing) -->
  <path d="M 580 144 L 785 160 L 785 200" stroke="#a78bfa" stroke-width="1.8" fill="none" marker-end="url(#arrPurple)" />

  <!-- Internal arrows in Center Branch -->
  <line x1="480" y1="263" x2="480" y2="277" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrCyan)" />
  <line x1="480" y1="338" x2="480" y2="352" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrCyan)" />
  <line x1="480" y1="413" x2="480" y2="427" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrCyan)" />

  <!-- Cross-signing arrow from R_SK to DeviceCertificate -->
  <path d="M 295 234 Q 480 260 660 300" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrEmerald)" />
  <rect x="425" y="255" width="110" height="18" rx="3" fill="#047857" />
  <text x="480" y="267" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">Signs Certificate</text>

</svg>
