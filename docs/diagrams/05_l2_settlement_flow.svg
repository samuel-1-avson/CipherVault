<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <marker id="mArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="mArrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="mArrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Workflow 3: Arbitrum L2 Settlement &amp; State Anchoring</text>
  <text x="460" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Cryptographic Commitment Submission, EIP-712 Evidence &amp; Sequencer Receipt Polling</text>

  <!-- Lifelines -->
  <!-- 1: Admin -->
  <rect x="30" y="70" width="110" height="36" rx="6" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="85" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Administrator</text>
  <line x1="85" y1="106" x2="85" y2="430" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 2: CLI -->
  <rect x="185" y="70" width="130" height="36" rx="6" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="250" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">CipherVault CLI</text>
  <line x1="250" y1="106" x2="250" y2="430" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 3: Relayer -->
  <rect x="365" y="70" width="140" height="36" rx="6" fill="url(#pGrad)" stroke="#a78bfa" stroke-width="1.2" />
  <text x="435" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Automated Relayer</text>
  <line x1="435" y1="106" x2="435" y2="430" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 4: Arbitrum Sequencer -->
  <rect x="555" y="70" width="150" height="36" rx="6" fill="url(#pGrad)" stroke="#a78bfa" stroke-width="1.2" />
  <text x="630" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Arbitrum Sequencer</text>
  <line x1="630" y1="106" x2="630" y2="430" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 5: Registry Contract -->
  <rect x="745" y="70" width="150" height="36" rx="6" fill="url(#pGrad)" stroke="#a78bfa" stroke-width="1.2" />
  <text x="820" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Registry.sol</text>
  <line x1="820" y1="106" x2="820" y2="430" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Step 1 -->
  <line x1="85" y1="125" x2="246" y2="125" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mArr)" />
  <text x="165" y="118" text-anchor="middle" fill="#f8fafc" font-size="10">ciphervault anchor --auto-relay</text>

  <!-- Step 2 -->
  <path d="M 250 140 C 300 140, 300 170, 254 170" fill="none" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#mArr)" />
  <text x="305" y="158" text-anchor="start" fill="#94a3b8" font-size="9">Commitment = BLAKE2b(VaultID || HeadCID || Salt)</text>

  <!-- Step 3 -->
  <line x1="250" y1="190" x2="431" y2="190" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#mArrPurple)" />
  <text x="340" y="183" text-anchor="middle" fill="#a78bfa" font-size="10">POST /v1/relayer/checkpoint (EIP-712 Evidence)</text>

  <!-- Step 4 -->
  <line x1="435" y1="215" x2="254" y2="215" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArrPurple)" />
  <text x="340" y="208" text-anchor="middle" fill="#94a3b8" font-size="9">HTTP 202 Accepted ("QueuedForRelay", block=0)</text>

  <!-- Step 5 -->
  <line x1="435" y1="245" x2="626" y2="245" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#mArrPurple)" />
  <text x="530" y="238" text-anchor="middle" fill="#a78bfa" font-size="10">eth_sendRawTransaction(setCommitment)</text>

  <!-- Step 6 -->
  <line x1="630" y1="275" x2="816" y2="275" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#mArrPurple)" />
  <text x="725" y="268" text-anchor="middle" fill="#a78bfa" font-size="10">Execute State Transition</text>

  <!-- Step 7 -->
  <line x1="820" y1="305" x2="634" y2="305" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArrPurple)" />
  <text x="725" y="298" text-anchor="middle" fill="#94a3b8" font-size="9">Emit StateCommitmentAnchored Event</text>

  <!-- Step 8: Polling -->
  <rect x="240" y="325" width="205" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <line x1="250" y1="345" x2="431" y2="345" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#mArr)" />
  <text x="340" y="340" text-anchor="middle" fill="#94a3b8" font-size="9">Poll Checkpoint Status</text>

  <line x1="435" y1="365" x2="254" y2="365" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArrGreen)" />
  <text x="340" y="360" text-anchor="middle" fill="#34d399" font-size="9">"SequencerConfirmed", Block #308,231,027</text>

  <!-- Step 9: Confirmed -->
  <line x1="250" y1="400" x2="89" y2="400" stroke="#34d399" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#mArrGreen)" />
  <text x="165" y="393" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">✓ On-Chain Settlement Finalized</text>

</svg>
