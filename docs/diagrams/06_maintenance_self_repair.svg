<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <marker id="mArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="mArrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="mArrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Workflow 4: Autonomous Fleet Durability &amp; Self-Repair</text>
  <text x="460" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Heartbeat Latency Probing, Degraded Replica Detection &amp; Automated Re-Replication</text>

  <!-- Lifelines -->
  <!-- 1: Maintenance Daemon -->
  <rect x="30" y="70" width="160" height="36" rx="6" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="110" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Maintenance Daemon</text>
  <line x1="110" y1="106" x2="110" y2="450" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 2: Fleet DB -->
  <rect x="235" y="70" width="130" height="36" rx="6" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="300" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">fleet.db (WAL)</text>
  <line x1="300" y1="106" x2="300" y2="450" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 3: Op 1 (Degraded) -->
  <rect x="405" y="70" width="130" height="36" rx="6" fill="url(#pGrad)" stroke="#ef4444" stroke-width="1.2" />
  <text x="470" y="93" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">Operator 1 (Fails)</text>
  <line x1="470" y1="106" x2="470" y2="450" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 4: Op 2 & 3 (Surviving) -->
  <rect x="575" y="70" width="140" height="36" rx="6" fill="url(#pGrad)" stroke="#34d399" stroke-width="1.2" />
  <text x="645" y="93" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">Operators 2 &amp; 3</text>
  <line x1="645" y1="106" x2="645" y2="450" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 5: Op 4 (Replacement) -->
  <rect x="755" y="70" width="135" height="36" rx="6" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="822" y="93" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Operator 4 (Repl)</text>
  <line x1="822" y1="106" x2="822" y2="450" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Step 1: Probe -->
  <line x1="110" y1="130" x2="466" y2="130" stroke="#ef4444" stroke-width="1.5" marker-end="url(#mArrRed)" />
  <text x="290" y="123" text-anchor="middle" fill="#ef4444" font-size="10">GET /v1/info (Probe Op 1)</text>

  <!-- Step 2: Timeout -->
  <line x1="470" y1="155" x2="114" y2="155" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArrRed)" />
  <text x="290" y="148" text-anchor="middle" fill="#ef4444" font-size="9">Connection Refused / Timeout (999ms)</text>

  <!-- Step 3: Probe Surviving -->
  <line x1="110" y1="185" x2="641" y2="185" stroke="#34d399" stroke-width="1.5" marker-end="url(#mArrGreen)" />
  <text x="375" y="178" text-anchor="middle" fill="#34d399" font-size="10">GET /v1/info (Probe Op 2 &amp; 3)</text>

  <line x1="645" y1="205" x2="114" y2="205" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArrGreen)" />
  <text x="375" y="200" text-anchor="middle" fill="#34d399" font-size="9">HTTP 200 OK (Latency: 12ms, 18ms)</text>

  <!-- Step 4: Audit Record -->
  <line x1="110" y1="235" x2="296" y2="235" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mArr)" />
  <text x="205" y="228" text-anchor="middle" fill="#38bdf8" font-size="10">Record Degraded Audit (2/3 replicas)</text>

  <!-- Step 5: Self-Repair Trigger -->
  <rect x="100" y="260" width="730" height="110" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" />
  <text x="115" y="278" fill="#38bdf8" font-size="10" font-weight="700">AUTONOMOUS RE-REPLICATION &amp; SELF-HEALING</text>

  <line x1="110" y1="300" x2="641" y2="300" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mArr)" />
  <text x="375" y="293" text-anchor="middle" fill="#38bdf8" font-size="10">GET /v1/objects/:cid (Read surviving chunk streams)</text>

  <line x1="645" y1="320" x2="114" y2="320" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArr)" />
  <text x="375" y="315" text-anchor="middle" fill="#94a3b8" font-size="9">Stream ciphertext bytes</text>

  <line x1="110" y1="345" x2="818" y2="345" stroke="#34d399" stroke-width="1.8" marker-end="url(#mArrGreen)" />
  <text x="465" y="340" text-anchor="middle" fill="#34d399" font-size="10">PUT /v1/objects/:cid (Re-replicate onto Replacement Operator 4)</text>

  <line x1="822" y1="362" x2="114" y2="362" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mArrGreen)" />
  <text x="465" y="358" text-anchor="middle" fill="#34d399" font-size="9">HTTP 201 Created</text>

  <!-- Step 6: Log Healed State -->
  <line x1="110" y1="395" x2="296" y2="395" stroke="#34d399" stroke-width="1.5" marker-end="url(#mArrGreen)" />
  <text x="205" y="388" text-anchor="middle" fill="#34d399" font-size="10">Record Healed State: 3/3 Replicas Restored</text>

  <rect x="100" y="415" width="200" height="24" rx="4" fill="#047857" />
  <text x="200" y="431" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">✓ Federation 100% Healthy</text>

</svg>
